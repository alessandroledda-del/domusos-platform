services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domusos}
      POSTGRES_USER: ${POSTGRES_USER:-domusos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domusos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domusos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-domusos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-domusos-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${MINIO_ROOT_USER:-domusos}
      ${MINIO_ROOT_PASSWORD:-domusos-secret};
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-domusos-media};
      mc anonymous set none local/${AWS_STORAGE_BUCKET_NAME:-domusos-media};
      exit 0;
      "

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep PONG"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  backend:
    build: ./backend
    command: >
      sh -c "
      python manage.py makemigrations accounts companies properties documents workflows audit reports notifications catalog orders billing integrations compliance analytics marketplace onboarding &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker -l INFO
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  clamav_data:
