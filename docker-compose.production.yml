services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "sh scripts/entrypoint.sh sh -c \'python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120\'"
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=2
    env_file: .env.production
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l INFO
    env_file: .env.production
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  static_data:
